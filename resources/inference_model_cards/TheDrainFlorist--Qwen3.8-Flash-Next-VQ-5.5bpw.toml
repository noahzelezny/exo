# VQLab VQ artifact (qwen4_exp), released 2026-08-30, HF twin of the local
# dir qwen4exp_vq_packed_d2k1024. Self-contained: the VQ runtime ships in the
# checkpoint as model.py (config vq_modules/vq_ple), so mlx_lm loads it with
# trust_remote_code and NO patch files. Arch support still comes from mlx-lm
# PR #1788 (unmerged): qwen4_exp.py must exist in each node's exo-env mlx_lm
# — re-drop after any exo env rebuild. Tensor-parallel needs the codebook-
# replicate guard in auto_parallel.py (upstream PR #2268). Vision tower
# grafted bf16 (333 tensors); config carries vision_config + image_token_id.
# Geometry: d2/K1024 experts (10-bit packed) + d8/K4096 PLE, flat allocation.
# KL 34.1, top-1 94.1%. 111.6 GiB - tight on a 128GB box, comfortable on 192.

[sampling_defaults]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
presence_penalty = 0.0
