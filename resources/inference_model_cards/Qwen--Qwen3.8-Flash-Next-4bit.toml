model_id = "Qwen/Qwen3.8-Flash-Next-4bit"
n_layers = 48
hidden_size = 2560
num_key_value_heads = 2
supports_tensor = false
tasks = ["TextGeneration"]
family = "qwen"
quantization = "4bit"
base_model = "Qwen3.8 Flash Next"
capabilities = ["text", "thinking", "thinking_toggle"]
reasoning_dialect = "post_last_user"
context_length = 262144
backends = ["MlxMetal"]
[storage_size]
in_bytes = 102825502953

# Qwen3.8-Flash-Next (qwen4_exp, 180B total / 10-of-512 active + 51B ngram
# PLE + MTP head), OUR 4-bit conversion 2026-08-27: body affine g64, ngram
# tables g32 (160-wide rows — stock convert SILENTLY SKIPS them at g64 and
# ships 7.8bpw), router bf16. 95.8 GiB -> fits the 128GB M4 ONLY; the 96GB
# M3 cannot serve it, hence supports_tensor=false (also: arch support comes
# from mlx-lm PR #1788 (unmerged, checkpoint first run by us 08-27) via
# qwen4_exp.py dropped into each node's exo-env mlx_lm — re-drop after any
# exo env rebuild). Text-only: vision tower dropped (a graft recipe now
# exists — graft_vision with the qwen4exp mapping, used by the VQ rungs —
# but has not been applied to this artifact). Smoke-tested M4 via mlx_lm:
# 34 tok/s decode, 103GB peak.
# Quality MEASURED 2026-08-29 (streamed referee, teacher top-64 cache):
# KL 293.9 mnats to bf16, top-1 79.6%, prose ppl 6.453. Dominated by the
# VQ rungs: TheDrainFlorist--Qwen3.8-Flash-Next-VQ-3.2bpw scores KL 123.5
# at 69.4 GiB (26 GiB smaller); VQ-4.4bpw scores KL 50.3 at ~the same
# size. Kept as the affine baseline / ladder anchor.

[sampling_defaults]
temperature = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
repetition_penalty = 1.0
presence_penalty = 0.0
